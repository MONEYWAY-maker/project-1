<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Screamdreamco Trivia</title>

  <link href="style.css" rel="stylesheet" type="text/css">
</head>

<body>

  <header class="hero">

    <p class="brand">SCREAMDREAMCO®</p>

    <!-- Header image -->
    <img src="header-logo.png" alt="Scream Dream Logo" class="hero-logo">

    <p class="tagline">
      SCREAM YOUR ANSWER.
    </p>

  </header>

  <main>

    <section class="categories">

      <p class="section-label">// CHOOSE YOUR CHAOS</p>

      <h2>SELECT A CATEGORY</h2>

      <div class="category-buttons">
        <button data-cat="11">🎬 MOVIES</button>
        <button data-cat="12">🎵 MUSIC</button>
        <button data-cat="21">🏀 SPORTS</button>
        <button data-cat="22">🌎 GEOGRAPHY</button>
        <button data-cat="17">🔬 SCIENCE</button>
        <button data-cat="15">🎮 GAMES</button>
      </div>

    </section>

    <section class="quiz">

      <p class="section-label">// TEST YOURSELF</p>

      <h2>QUESTION</h2>

      <div class="question-box">
        <p class="question">Loading question...</p>
      </div>

      <div class="answers-mc"></div>

      <div class="quiz-buttons">
        <button class="next-button">
          NEXT QUESTION →
        </button>
      </div>

    </section>

  </main>

  <footer>

    <p>SCREAMDREAMCO®</p>
    <small>DREAM IT. SCREAM IT.</small>

  </footer>

  <script src="script.js"></script>

</body>
</html>
