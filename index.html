<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Screamdreamco Trivia</title>

  <link href="style.css" rel="stylesheet" type="text/css">
</head>

<body>

  <header class="hero">

    <p class="brand">SCREAMDREAMCO®</p>

    <h1>
      TRIVIA<br>
      <span>TIME</span>
    </h1>

    <p class="tagline">
      SCREAM YOUR ANSWER.
    </p>

  </header>


  <main>

    <section class="categories">

      <p class="section-label">// CHOOSE YOUR CHAOS</p>

      <h2>SELECT A CATEGORY</h2>

      <div class="category-buttons">

        <button>🎬 MOVIES</button>
        <button>🎵 MUSIC</button>
        <button>🏀 SPORTS</button>
        <button>🌎 GEOGRAPHY</button>
        <button>🔬 SCIENCE</button>
        <button>🎮 GAMES</button>

      </div>

    </section>


    <section class="quiz">

      <p class="section-label">// TEST YOURSELF</p>

      <h2>QUESTION</h2>

      <div class="question-box">

        <p class="question">
          WHAT IS THE LARGEST PLANET
          IN OUR SOLAR SYSTEM?
        </p>

      </div>


      <div class="answer-box">

        <p class="section-label">// ANSWER</p>

        <p>JUPITER</p>

      </div>


      <div class="quiz-buttons">

        <button class="answer-button">
          👁 SHOW ANSWER
        </button>

        <button class="next-button">
          NEXT QUESTION →
        </button>

      </div>

    </section>

  </main>


  <footer>

    <p>SCREAMDREAMCO®</p>

    <small>
      DREAM IT. SCREAM IT.
    </small>

  </footer>


  <script src="script.js"></script>

</body>

</html>
